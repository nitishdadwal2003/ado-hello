
name: actions use

on:
  workflow_dispatch:
    inputs:
      java_version:
        description: "Java version"
        required: true
        default: "17"

jobs:
  javabuild:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          java-version: ${{ inputs.java_version }}
          distribution: "temurin"

      - name: Print Java version
        run: java --version
      - name: docker login
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.REGUSER }}
          password: ${{ secrets.REGPASS }}
          registry: ${{ VARS.ART_URL }}
        

