name: demo of variable and parmeters
on:
    workflow_dispatch:
      inputs:
        environment:
          description: 'Environment to deploy'
          required: true
          default: 'DEV'
          type: choice
          options:
            - DEV
            - QA
            - PROD
        reponame:
           description: 'Repository name'
           required: true
           type: string
           default: 'ado-hello'
        is_deploy:
          description: 'Is this deployment'
          required: true
          default: false
          type: boolean

env:
  name: "RAM"
  environment: "${{ inputs.environment }}"
   
jobs:
    variable-parameters:
        runs-on: ubuntu-latest
        steps:
          - name: demo of varaible and parameters
            run: |
              echo "Name: ${{ env.name }}"
              echo "Environment: ${{ env.environment }}"
          - name: variable from actions
            run: |
                 echo "This is variable from actions: ${{ VARS.ID }}"
          - name: secret using docker login
            run: |
              echo ${{ secrets.REGPASS }} | docker login --username ${{ secrets.REGUSER }} --password-stdin  ${{ vars.ART_URL }}
          - name: i will run when dev selected
            if: ${{ inputs.environment == 'DEV'}}
            run: "This step will run when only dev environment is selected"
          - name: i will run when dev selected
            if: ${{ inputs.environment == 'QA'}}
            run: "This step will run when only QA environment is selected"
          - name: i will run when dev selected
            if: ${{ inputs.environment == 'PROD'}}
            run: "This step will run when only DEV environment is selected"
          