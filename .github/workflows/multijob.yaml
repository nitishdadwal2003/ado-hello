name: multi job demo
on: 
  workflow_dispatch:
jobs:
    jobA:
      runs-on: ubuntu-latest
      steps:
        - name: jobA
          run: echo "This is jobA"
    jobB:
        runs-on: ubuntu-latest
        needs: jobA
        steps:
            - name: jobB
              run: echo "This is jobB, it depends on jobA"
    jobC:
        runs-on: ubuntu-latest
        needs: jobB
        steps:
            - name: jobC
              run: echo "This is jobB, it depends on jobA"